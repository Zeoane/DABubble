<div class="legal-page">
  <header class="legal-header">
    <app-logo class="desktop-logo" [link]="home()" />
    <app-logo class="mobile-logo" [link]="home()" [compact]="true" />
    @if (me(); as user) {
      <a class="me" routerLink="/workspace" aria-label="Zurück zum Workspace">
        <app-avatar [src]="user.avatar" [size]="50" />
      </a>
    }
  </header>

  <main class="content" [class.card]="card()">
    <button type="button" class="legal-back" aria-label="Zurück" (click)="goBack()">
      <img src="img/icons/arrow-back.svg" alt="" />
    </button>
    <h1>{{ title() }}</h1>
    <ng-content />
  </main>
</div>
