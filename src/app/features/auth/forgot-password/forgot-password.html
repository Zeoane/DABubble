<div class="auth-page">
  <header>
    <app-logo />
  </header>

  <main class="auth-main">
    <section class="auth-card reset-card">
      <a class="back-button" routerLink="/" aria-label="Zurück zur Anmeldung">
        <img src="img/icons/arrow-back.svg" alt="" />
      </a>
      <h1>Passwort zurücksetzen</h1>
      <p class="auth-intro">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

      <form class="form" [formGroup]="form" (ngSubmit)="send()" novalidate>
        <div class="input-group">
          <label class="input-field">
            <img src="img/icons/mail.svg" alt="" />
            <input type="email" formControlName="email" placeholder="beispielname@email.com" autocomplete="email" />
          </label>
          @if (showError()) {
            <p class="error-message">{{ emailMessage(form.controls.email) }}</p>
          } @else if (sendError(); as error) {
            <p class="error-message">{{ error }}</p>
          }
        </div>

        <p class="hint">Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.</p>

        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="form.invalid || loading()">E-Mail senden</button>
        </div>
      </form>
    </section>
  </main>

  <app-legal-links />

  @if (sent()) {
    <app-toast message="E-Mail gesendet" icon="img/icons/send.svg" />
  }
</div>
