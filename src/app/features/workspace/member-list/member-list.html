<ul class="members">
  @let myId = users.uid();
  @for (member of members(); track member.uid) {
    <li class="member">
      <app-avatar [src]="member.avatar" [online]="member.uid === myId" />
      <span class="name">{{ member.name }}@if (member.uid === myId) { (Du)}</span>
    </li>
  }
</ul>
<button type="button" class="add" (click)="add.emit()">
  <span class="add-icon"><span class="icon icon-person-add" aria-hidden="true"></span></span>
  Mitglieder hinzufügen
</button>
