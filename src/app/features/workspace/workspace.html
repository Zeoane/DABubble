<div class="workspace" [class.chat-open]="chatOpen()">
  <app-workspace-header class="header" [chatOpen]="chatOpen()" />

  <div class="content" [class.menu-closed]="!menuOpen()">
    <aside class="menu" [attr.aria-hidden]="!menuOpen()" [inert]="!menuOpen()">
      <app-workspace-menu />
    </aside>

    <main class="chat">
      <router-outlet />
    </main>
  </div>

  <button type="button" class="menu-toggle" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
    <span class="icon" [class.icon-hide]="menuOpen()" [class.icon-show]="!menuOpen()" aria-hidden="true"></span>
    <span class="label">{{ menuOpen() ? 'Workspace-Menü schließen' : 'Workspace-Menü öffnen' }}</span>
  </button>
</div>
