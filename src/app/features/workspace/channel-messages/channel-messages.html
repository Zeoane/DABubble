<div class="scroller" #scroller>
  <div class="intro">
    <p class="intro-title"><span class="tag" aria-hidden="true"></span>{{ channel().name }}</p>
    <p class="intro-text">
      {{ createdText() }}
      <span class="intro-name"><span class="tag small" aria-hidden="true"></span>{{ channel().name }}.</span>
    </p>
    @if (channel().description) {
      <p class="intro-description">{{ channel().description }}</p>
    }
  </div>

  @let myId = users.uid();
  @for (day of days(); track day.label) {
    <div class="day" role="separator">
      <span>{{ day.label }}</span>
    </div>
    @for (message of day.messages; track message.id) {
      <app-message-item [message]="message" [author]="author(message)" [own]="message.authorId === myId" />
    }
  }
</div>
